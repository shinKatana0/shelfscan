name: Bug report
description: Something did not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach your shelf photos. Describe what was on the
        spine instead — the photos are pictures of your home, and an issue
        thread is public. For a security or privacy problem, use the
        Security tab rather than this form (see SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Vision backend
      description: Most failures here are provider-shaped, so this is the first thing anyone will ask.
      options:
        - Local (Ollama)
        - Cloud (Anthropic)
        - Endpoint (OpenAI-compatible)
        - No vision — installed games or GOG library scan
        - Not a scan — export, review or resolve only
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Vision model
      description: The exact id, e.g. `qwen2.5vl:7b`, or `none` if the run read no photographs. Say if a `--fallback` second reader was on, and which.
      placeholder: qwen2.5vl:7b
    validations:
      required: true

  - type: input
    id: shell
    attributes:
      label: CLI or app, and OS
      placeholder: CLI, Windows 11
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What the run printed
      description: The command and its output, or the error the app showed. Redact any key. A disk scan lists your games folder — trim it to the rows that matter.
      render: text
