name: shelfscan_app
description: Turn shelf photos into an importable game collection (Windows + Android).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  shelfscan_core:
    path: ../packages/shelfscan_core
  file_picker: ^12.0.0
  # HEIC decoding calls the Windows Imaging Component over dart:ffi, and
  # dart:ffi ships no allocator (see heic_wic.dart for the alternatives).
  ffi: ^2.1.0
  # Export saving lives in the shell (ARCHITECTURE.md platform boundary):
  # file_selector = Windows save dialog, share_plus = Android share sheet.
  file_selector: ^1.0.3
  share_plus: ^13.2.0
  path_provider: ^2.1.0 # temp file for the Android share sheet
  # Settings persistence, split by sensitivity (BYOK, decision 0011):
  # secrets go to the OS keychain, plain preferences to shared_preferences.
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.2
  # Flutter renders no SVG natively and nothing already in the graph does.
  # TMDB publishes its mark in five SVG variants and no raster format, so
  # rasterising would mean producing a derivative in a format the mark's owner
  # does not publish, against a page that states no alteration rule (T-0385).
  flutter_svg: ^2.0.10
  # TODO: image_picker (camera capture)

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The only way to reach the real keychain and the real preferences file:
  # `flutter test` runs on flutter_tester, which has no platform channels, so
  # every existing settings test is against a fake (T-0017). Ships with the
  # SDK, adds nothing to the release graph, and drives
  # integration_test/keychain_persistence_test.dart only.
  integration_test:
    sdk: flutter
  # Lets the save-dialog tests swap FileSelectorPlatform for a fake.
  file_selector_platform_interface: ^2.7.0
  # No new package in the graph -- shelfscan_core's only runtime dependency,
  # declared here so a test can build the real VisionUnreachableException,
  # whose constructor takes an http.ClientException (T-0102).
  http: ^1.2.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # NEITHER OF THESE REACHES A BUILT APP (T-0386). A key beginning `../` is
    # written relative to `build/flutter_assets/` and so lands OUTSIDE it;
    # packaging copies that directory and leaves the escaped files behind.
    # Tests pass because the test bundle sits beside the same escaped copies.
    #
    # Repository-level data file, shared with the CLI: one alias table, not
    # an app copy that drifts from it.
    - ../data/title_aliases.json
    # TMDB's mark, as published. Repository-level for the same reason as the
    # alias table above; unaltered for the reason beside flutter_svg.
    - ../assets/tmdb/blue_long_1.svg
