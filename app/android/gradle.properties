org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 defaults both of these to true, deprecates setting either to false, and
# removes both in AGP 10. The pair below is Flutter's own documented target
# state and neither half is free to move -- doc/android-build.md, "Built-in
# Kotlin is taken; the new DSL is blocked upstream".
#
# newDsl stays false because with it true the Flutter Gradle Plugin fails to
# apply at all: it casts the project's android extension to
# AbstractAppExtension, and the new DSL hands it an ApplicationExtension
# (T-0399, Flutter 3.47.0 / AGP 9.1.0).
android.newDsl=false
# builtInKotlin=true is what removes the standalone-KGP deprecation from :app
# and eight plugin subprojects. The declaration in settings.gradle.kts stays:
# it is what pins the Kotlin version built-in Kotlin uses.
android.builtInKotlin=true
